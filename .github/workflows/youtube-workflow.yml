name: Latest YouTube Videos
on:
  schedule:
    # Runs every 6 hours (YouTube RSS intermittently 404s; hourly was noisy)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-readme-with-youtube:
    name: Update this repo's README with latest videos from YouTube
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "YOUTUBE"
          # Channel: https://www.youtube.com/@HarishinVietnam
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UC5vH5aGrKlsItfR7Q8c4CgQ"
          # YouTube's Atom feed returns intermittent 404s from Actions runners
          retry_count: "10"
          retry_wait_time: "30"
